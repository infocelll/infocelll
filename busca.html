<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFOCELLL · Busca Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f2f5fa;
            color: #0b1a2f;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        body.dark-mode {
            background: #0d1829;
            color: #e8edf5;
        }

        /* ===== NAVBAR ===== */
        .navbar-custom {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .dark-mode .navbar-custom {
            background: rgba(10, 22, 42, 0.75);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .mono-icon { color: #1a3a6b; transition: color 0.15s; }
        .dark-mode .mono-icon { color: #b0c8e8; }

        .badge-mono {
            background: rgba(26, 58, 107, 0.06);
            color: #1a3a6b;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.6rem;
            display: inline-block;
        }
        .dark-mode .badge-mono {
            background: rgba(255,255,255,0.05);
            color: #b0c8e8;
        }

        /* ===== CAMPO DE BUSCA ===== */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        .search-container {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 24px rgba(0,0,0,0.02);
            transition: 0.3s;
            padding: 6px 6px 6px 24px;
        }
        .dark-mode .search-container {
            background: rgba(0,0,0,0.3);
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }
        .search-container:focus-within {
            border-color: #1a3a6b;
            box-shadow: 0 0 0 4px rgba(26, 58, 107, 0.05);
            transform: scale(1.005);
        }
        .dark-mode .search-container:focus-within {
            border-color: #3b6bc0;
            box-shadow: 0 0 0 4px rgba(59, 107, 192, 0.08);
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input-wrap {
            flex: 1;
            position: relative;
        }
        .search-input-wrap input {
            background: transparent;
            border: none;
            padding: 14px 0;
            font-weight: 400;
            font-size: 1.05rem;
            color: #0b1a2f;
            width: 100%;
            outline: none;
        }
        .dark-mode .search-input-wrap input {
            color: #e8edf5;
        }
        .search-input-wrap input::placeholder {
            color: #8a9bb0;
            font-weight: 300;
        }
        .dark-mode .search-input-wrap input::placeholder {
            color: #5a6f8a;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .search-actions .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #1a3a6b;
            font-size: 0.95rem;
            transition: 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dark-mode .search-actions .btn-icon {
            color: #b0c8e8;
        }
        .search-actions .btn-icon:hover {
            background: rgba(26,58,107,0.06);
        }
        .dark-mode .search-actions .btn-icon:hover {
            background: rgba(255,255,255,0.04);
        }
        .search-actions .btn-icon.primary {
            background: #1a3a6b;
            color: white;
        }
        .dark-mode .search-actions .btn-icon.primary {
            background: #3b6bc0;
            color: white;
        }
        .search-actions .btn-icon.primary:hover {
            background: #0f2a4a;
        }
        .dark-mode .search-actions .btn-icon.primary:hover {
            background: #2a5a9a;
        }

        /* ===== AUTOCOMPLETE FLUTUANTE ===== */
        .autocomplete-box {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 16px 48px rgba(0,0,0,0.08);
            max-height: 380px;
            overflow-y: auto;
            z-index: 1050;
            display: none;
            padding: 8px 0;
        }
        .dark-mode .autocomplete-box {
            background: rgba(16, 30, 52, 0.95);
            border-color: rgba(255,255,255,0.04);
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }
        .autocomplete-box.show {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.1s;
            border-radius: 12px;
            margin: 0 6px;
        }
        .autocomplete-item:hover {
            background: rgba(26, 58, 107, 0.04);
        }
        .dark-mode .autocomplete-item:hover {
            background: rgba(255,255,255,0.03);
        }
        .autocomplete-item .highlight { font-weight: 600; color: #1a3a6b; }
        .dark-mode .autocomplete-item .highlight { color: #b0c8e8; }
        .autocomplete-item .sub { font-size: 0.7rem; opacity: 0.6; }
        .autocomplete-item .tag {
            font-size: 0.55rem;
            background: rgba(26,58,107,0.06);
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: auto;
        }
        .dark-mode .autocomplete-item .tag {
            background: rgba(255,255,255,0.04);
        }

        .autocomplete-item .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .autocomplete-divider {
            padding: 6px 20px;
            font-size: 0.6rem;
            color: #8a9bb0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(26,58,107,0.04);
        }
        .dark-mode .autocomplete-divider {
            border-top-color: rgba(255,255,255,0.04);
        }

        .autocomplete-see-all {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #1a3a6b;
            font-weight: 500;
            text-align: center;
            border-top: 1px solid rgba(26,58,107,0.04);
            transition: 0.1s;
            border-radius: 0 0 12px 12px;
        }
        .dark-mode .autocomplete-see-all {
            color: #b0c8e8;
            border-top-color: rgba(255,255,255,0.04);
        }
        .autocomplete-see-all:hover {
            background: rgba(26,58,107,0.04);
        }
        .dark-mode .autocomplete-see-all:hover {
            background: rgba(255,255,255,0.02);
        }

        /* ===== RESULTADOS PÁGINA ===== */
        .result-area {
            max-width: 680px;
            margin: 24px auto 0;
            width: 100%;
            padding: 0 10px;
        }

        .result-card {
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px 24px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.2s;
            margin-bottom: 10px;
            animation: fadeIn 0.25s ease;
            border-left: 3px solid #1a3a6b;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .dark-mode .result-card {
            background: rgba(255,255,255,0.02);
            border-color: rgba(255,255,255,0.04);
            border-left-color: #b0c8e8;
        }
        .result-card:hover {
            background: rgba(255,255,255,0.6);
        }
        .dark-mode .result-card:hover {
            background: rgba(255,255,255,0.03);
        }

        .compat-chip {
            background: rgba(26, 58, 107, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: inline-block;
            margin: 2px 4px 2px 0;
        }
        .dark-mode .compat-chip {
            background: rgba(255,255,255,0.04);
        }

        .result-stats {
            font-size: 0.75rem;
            color: #8a9bb0;
            padding: 4px 0 12px 0;
        }
        .result-stats strong {
            color: #1a3a6b;
        }
        .dark-mode .result-stats strong {
            color: #b0c8e8;
        }

        .shortcut-hint {
            font-size: 0.55rem;
            opacity: 0.4;
            color: #1a3a6b;
            background: rgba(26,58,107,0.04);
            padding: 2px 10px;
            border-radius: 20px;
        }
        .dark-mode .shortcut-hint {
            color: #b0c8e8;
            background: rgba(255,255,255,0.04);
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        .toast-item {
            min-width: 220px;
            padding: 14px 20px;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2c6fdb; border-radius: 20px; }

        @media (max-width: 576px) {
            .search-container { padding: 4px 4px 4px 16px; }
            .search-input-wrap input { font-size: 0.9rem; padding: 10px 0; }
            .search-actions .btn-icon { width: 32px; height: 32px; font-size: 0.8rem; }
            .autocomplete-box { max-height: 300px; margin: 0 4px; }
            .result-card { padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- NAVBAR -->
    <nav class="navbar-custom">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a class="navbar-brand fw-bold fs-5 d-flex align-items-center gap-2" href="#" id="brandLink">
                    <span class="mono-icon" style="font-size:1.5rem;"><i class="bi bi-phone"></i></span>
                    <span>INFOCELLL</span>
                    <span class="badge-mono ms-2" style="font-size:0.5rem;">Busca</span>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge-mono" id="totalModels">0</span>
                    <span class="shortcut-hint">Ctrl+K</span>
                    <button class="btn-mono py-1 px-3" id="themeToggle" style="font-size:0.7rem; background:transparent; border:1px solid rgba(26,58,107,0.15); border-radius:40px; color:#1a3a6b; cursor:pointer;">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-12">

                <!-- Busca Centralizada -->
                <div class="text-center mb-3">
                    <h2 class="fw-bold" style="font-size:1.3rem; letter-spacing:-0.5px;">
                        <span class="mono-icon"><i class="bi bi-search"></i></span>
                        Encontre películas compatíveis
                    </h2>
                    <p class="text-secondary" style="font-size:0.85rem;">Digite o modelo do celular</p>
                </div>

                <div class="search-wrapper">
                    <div class="search-container" id="searchContainer">
                        <div class="search-row">
                            <span class="mono-icon" style="font-size:1.1rem; flex-shrink:0;"><i class="bi bi-search"></i></span>
                            <div class="search-input-wrap">
                                <input type="text" id="globalSearch" placeholder="Ex: Galaxy A15, iPhone 15, Moto G84..." autocomplete="off">
                            </div>
                            <div class="search-actions">
                                <button class="btn-icon" id="voiceBtn" title="Busca por voz"><i class="bi bi-mic"></i></button>
                                <button class="btn-icon" id="cameraBtn" title="Busca por câmera"><i class="bi bi-camera"></i></button>
                                <button class="btn-icon primary" id="searchBtn"><i class="bi bi-arrow-right"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- AUTOCOMPLETE FLUTUANTE -->
                    <div class="autocomplete-box" id="autocompleteBox"></div>
                </div>

                <!-- Sugestões rápidas -->
                <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
                    <span class="badge-mono suggestion-chip" data-term="Galaxy A15" style="cursor:pointer;">Galaxy A15</span>
                    <span class="badge-mono suggestion-chip" data-term="iPhone 15" style="cursor:pointer;">iPhone 15</span>
                    <span class="badge-mono suggestion-chip" data-term="Moto G84" style="cursor:pointer;">Moto G84</span>
                    <span class="badge-mono suggestion-chip" data-term="Redmi Note 13" style="cursor:pointer;">Redmi Note 13</span>
                    <span class="badge-mono suggestion-chip" data-term="Galaxy S24" style="cursor:pointer;">Galaxy S24</span>
                </div>

                <!-- Área de Resultados -->
                <div class="result-area" id="resultArea">
                    <div class="text-center py-5">
                        <span class="mono-icon fs-1"><i class="bi bi-search"></i></span>
                        <p class="mt-3 text-secondary" style="font-size:0.95rem;">Digite um modelo para encontrar películas compatíveis</p>
                        <p class="text-secondary small">Ex: Galaxy A15, iPhone 15, Moto G84</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="container text-center text-secondary small py-3 border-top border-light-subtle">
        <span>INFOCELLL · Busca Inteligente</span>
        <span class="mx-2">|</span>
        <span id="footerModels">0 modelos</span>
        <span class="mx-2">|</span>
        <span>⌨️ Ctrl+K · ESC limpa</span>
    </footer>

    <script>
        (function() {
            // =============================================
            // BANCO DE DADOS
            // =============================================
            const database = [];

            const marcas = ['Samsung', 'Apple', 'Motorola', 'Xiaomi', 'Redmi', 'Poco', 'Realme', 'Oppo', 'Vivo', 'LG',
                'Nokia', 'Sony', 'OnePlus', 'Nothing', 'Asus'
            ];

            const modelosExemplo = {
                'Samsung': ['Galaxy A15', 'Galaxy A25', 'Galaxy A35', 'Galaxy A55', 'Galaxy S24', 'Galaxy S24 Ultra',
                    'Galaxy S23', 'Galaxy S23 Ultra', 'Galaxy Z Flip 5', 'Galaxy Z Fold 5', 'Galaxy A54', 'Galaxy A34',
                    'Galaxy M15', 'Galaxy F15'
                ],
                'Apple': ['iPhone 15', 'iPhone 15 Pro', 'iPhone 15 Pro Max', 'iPhone 14', 'iPhone 14 Pro',
                    'iPhone 14 Pro Max', 'iPhone 13', 'iPhone 13 Pro', 'iPhone SE 3', 'iPhone 12', 'iPhone 11'
                ],
                'Motorola': ['Moto G84', 'Moto G54', 'Moto G34', 'Moto G24', 'Edge 40', 'Edge 40 Pro', 'Edge 30',
                    'Moto G73', 'Moto G53', 'Moto G62', 'Moto G71'
                ],
                'Xiaomi': ['Xiaomi 14', 'Xiaomi 14 Pro', 'Xiaomi 14 Ultra', 'Xiaomi 13', 'Xiaomi 13 Pro',
                    'Xiaomi 13 Ultra', 'Xiaomi 12'
                ],
                'Redmi': ['Redmi Note 13', 'Redmi Note 13 Pro', 'Redmi Note 13 Pro Plus', 'Redmi Note 12',
                    'Redmi Note 12 Pro', 'Redmi 13C', 'Redmi 12C'
                ],
                'Poco': ['Poco X6', 'Poco X6 Pro', 'Poco X5', 'Poco X5 Pro', 'Poco F5', 'Poco F5 Pro', 'Poco M6 Pro'],
                'Realme': ['Realme GT 5 Pro', 'Realme GT 5', 'Realme GT Neo 5', 'Realme 12 Pro Plus', 'Realme 12 Pro',
                    'Realme 11 Pro'
                ],
                'Oppo': ['Oppo Find X7 Ultra', 'Oppo Find X7', 'Oppo Find X6 Pro', 'Oppo Reno 11 Pro', 'Oppo Reno 11',
                    'Oppo A98'
                ],
                'Vivo': ['Vivo X100 Pro', 'Vivo X100', 'Vivo V30 Pro', 'Vivo V30', 'Vivo Y100'],
                'LG': ['LG Velvet', 'LG Wing', 'LG G8 ThinQ', 'LG V60 ThinQ', 'LG K52', 'LG K62'],
                'Nokia': ['Nokia G60 5G', 'Nokia G50 5G', 'Nokia X30 5G', 'Nokia C22', 'Nokia C32'],
                'Sony': ['Sony Xperia 1 V', 'Sony Xperia 5 V', 'Sony Xperia 10 V'],
                'OnePlus': ['OnePlus 12', 'OnePlus 11', 'OnePlus 10 Pro', 'OnePlus Nord 3'],
                'Nothing': ['Nothing Phone 2', 'Nothing Phone 1', 'Nothing Phone 2a'],
                'Asus': ['Asus ZenFone 10', 'Asus ZenFone 9', 'Asus ROG Phone 7'],
            };

            const peliculas = ['HYD-1025', 'CER-221', 'GLASS-3D', 'FLEX-PRO', 'PRIV-221', 'MATTE-44', 'NANO-ARM', 'HYD-2024',
                'CER-X1', 'GLASS-PRO'
            ];
            const tipos = ['Hidrogel', 'Cerâmica', 'Vidro 3D', 'Flexível', 'Privacidade', 'Fosco', 'Nano', 'Hidrogel+',
                'Cerâmica Pro', 'Vidro Premium'
            ];
            const durezas = ['9H', '9H+', '10H', '9H', '7H', '9H', '10H', '9H', '10H', '9H+'];

            for (const marca of marcas) {
                const modelos = modelosExemplo[marca] || ['Modelo Padrão'];
                for (const modelo of modelos) {
                    const pelIdx = Math.floor(Math.random() * peliculas.length);
                    database.push({
                        modelo: modelo,
                        marca: marca,
                        codigo: (marca.substring(0, 2) + Math.floor(Math.random() * 9000) + 1000).toUpperCase(),
                        ano: 2020 + Math.floor(Math.random() * 5),
                        pelicula: peliculas[pelIdx],
                        tipo: tipos[pelIdx],
                        dureza: durezas[pelIdx],
                        compat: [modelo, ...modelos.filter(m => m !== modelo).slice(0, 2)],
                        grupo: (marca.substring(0, 3) + '-GRP').toUpperCase()
                    });
                }
            }

            // =============================================
            // LEVENSHTEIN
            // =============================================
            function levenshtein(a, b) {
                const matrix = [];
                for (let i = 0; i <= b.length; i++) matrix[i] = [i];
                for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        if (b[i - 1] === a[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
                        else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
                    }
                }
                return matrix[b.length][a.length];
            }

            // =============================================
            // AUTOCOMPLETE
            // =============================================
            function getAutocomplete(query, maxResults = 5) {
                const q = query.toLowerCase().trim();
                if (q.length < 1) return [];

                const results = [];
                const seen = new Set();

                database.slice(0, 200).forEach(m => {
                    const searchText = `${m.modelo} ${m.marca} ${m.codigo}`.toLowerCase();
                    if (searchText.includes(q) && !seen.has(m.modelo)) {
                        seen.add(m.modelo);
                        let tag = 'Modelo',
                            icon = '📱';
                        if (m.codigo.toLowerCase().includes(q)) { tag = 'Código';
                            icon = '🔢'; }
                        if (m.marca.toLowerCase().includes(q)) { tag = 'Marca';
                            icon = '🏷️'; }
                        results.push({
                            label: m.modelo,
                            sub: `${m.marca} · ${m.codigo}`,
                            tag: tag,
                            icon: icon,
                            marca: m.marca,
                            score: m.modelo.toLowerCase().startsWith(q) ? 10 : 5
                        });
                    }
                    if (m.codigo.toLowerCase().includes(q) && !seen.has(m.codigo)) {
                        seen.add(m.codigo);
                        results.push({
                            label: m.codigo,
                            sub: `${m.marca} ${m.modelo}`,
                            tag: 'Código',
                            icon: '🔢',
                            marca: m.marca,
                            score: 8
                        });
                    }
                });

                // Ordenar por relevância
                results.sort((a, b) => {
                    if (a.label.toLowerCase().startsWith(q) && !b.label.toLowerCase().startsWith(q)) return -1;
                    if (!a.label.toLowerCase().startsWith(q) && b.label.toLowerCase().startsWith(q)) return 1;
                    return b.score - a.score;
                });

                return results.slice(0, maxResults);
            }

            // =============================================
            // BUSCA COMPLETA
            // =============================================
            function searchFull(query) {
                const q = query.toLowerCase().trim();
                if (q.length < 1) return [];

                const results = database.filter(m =>
                    m.modelo.toLowerCase().includes(q) ||
                    m.marca.toLowerCase().includes(q) ||
                    m.codigo.toLowerCase().includes(q) ||
                    m.pelicula.toLowerCase().includes(q)
                );

                // Agrupa por película para mostrar compatibilidade
                const grouped = {};
                results.forEach(m => {
                    const key = m.pelicula;
                    if (!grouped[key]) {
                        grouped[key] = {
                            pelicula: m.pelicula,
                            tipo: m.tipo,
                            dureza: m.dureza,
                            modelos: []
                        };
                    }
                    grouped[key].modelos.push(m);
                });

                return Object.values(grouped);
            }

            // =============================================
            // RENDER AUTOCOMPLETE FLUTUANTE
            // =============================================
            function renderAutocomplete(suggestions) {
                const box = document.getElementById('autocompleteBox');
                if (suggestions.length === 0) {
                    box.classList.remove('show');
                    return;
                }

                let html = suggestions.map(s => `
                    <div class="autocomplete-item" data-modelo="${s.label}" data-marca="${s.marca}">
                        <span class="icon">${s.icon || '📱'}</span>
                        <div>
                            <span class="highlight">${s.label}</span>
                            <span class="sub">${s.sub}</span>
                        </div>
                        <span class="tag">${s.tag}</span>
                    </div>
                `).join('');

                // Botão "Ver todos"
                html += `
                    <div class="autocomplete-see-all" id="seeAllResults">
                        Ver todos os resultados
                    </div>
                `;

                box.innerHTML = html;
                box.classList.add('show');

                // Eventos
                box.querySelectorAll('.autocomplete-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const modelo = this.dataset.modelo;
                        const marca = this.dataset.marca || '';
                        document.getElementById('globalSearch').value = `${marca} ${modelo}`.trim();
                        box.classList.remove('show');
                        doFullSearch(`${marca} ${modelo}`.trim());
                    });
                });

                document.getElementById('seeAllResults').addEventListener('click', function() {
                    const query = document.getElementById('globalSearch').value;
                    box.classList.remove('show');
                    doFullSearch(query);
                });
            }

            // =============================================
            // RENDER RESULTADOS COMPLETOS
            // =============================================
            function renderFullResults(groups, query) {
                const area = document.getElementById('resultArea');

                if (!groups || groups.length === 0) {
                    area.innerHTML = `
                        <div class="text-center py-5">
                            <span class="mono-icon fs-1"><i class="bi bi-search"></i></span>
                            <p class="mt-3 text-secondary">Nenhum resultado para "<strong>${query}</strong>"</p>
                            <p class="text-secondary small">Tente: Galaxy A15, iPhone 15, Moto G84</p>
                        </div>
                    `;
                    return;
                }

                const allModels = groups.flatMap(g => g.modelos);
                const firstModel = allModels[0];

                let html = `
                    <div class="result-stats">
                        <strong>${groups.length}</strong> película(s) compatível(eis) com <strong>${firstModel.marca} ${firstModel.modelo}</strong>
                    </div>
                `;

                groups.forEach(g => {
                    const modelos = g.modelos.map(m => m.modelo).filter((v, i, a) => a.indexOf(v) === i);
                    const marcas = [...new Set(g.modelos.map(m => m.marca))];

                    html += `
                        <div class="result-card">
                            <div class="d-flex align-items-start flex-wrap gap-2">
                                <span class="fw-semibold" style="font-size:1.05rem;">${g.pelicula}</span>
                                <span class="badge-mono">${g.tipo}</span>
                                <span class="badge-mono">Dureza: ${g.dureza}</span>
                            </div>
                            <div class="mt-2">
                                <span class="text-secondary small">Modelos compatíveis:</span>
                                <div class="mt-1">
                                    ${modelos.map(m => `<span class="compat-chip">${m}</span>`).join('')}
                                    ${marcas.length > 1 ? `<span class="compat-chip" style="background:rgba(26,58,107,0.08);">+ ${marcas.length} marcas</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });

                area.innerHTML = html;
            }

            // =============================================
            // AÇÕES PRINCIPAIS
            // =============================================
            let searchTimeout = null;

            function onSearchInput(query) {
                const q = query.trim();
                const box = document.getElementById('autocompleteBox');

                if (q.length < 1) {
                    box.classList.remove('show');
                    return;
                }

                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    const suggestions = getAutocomplete(q, 5);
                    renderAutocomplete(suggestions);
                }, 150);
            }

            function doFullSearch(query) {
                const q = query.trim();
                const box = document.getElementById('autocompleteBox');
                box.classList.remove('show');

                if (q.length < 1) {
                    document.getElementById('resultArea').innerHTML = `
                        <div class="text-center py-5">
                            <span class="mono-icon fs-1"><i class="bi bi-search"></i></span>
                            <p class="mt-3 text-secondary">Digite um modelo para encontrar películas compatíveis</p>
                            <p class="text-secondary small">Ex: Galaxy A15, iPhone 15, Moto G84</p>
                        </div>
                    `;
                    return;
                }

                const results = searchFull(q);
                renderFullResults(results, q);
            }

            // =============================================
            // EVENTOS
            // =============================================
            const searchInput = document.getElementById('globalSearch');
            const box = document.getElementById('autocompleteBox');

            searchInput.addEventListener('input', function() {
                onSearchInput(this.value);
            });

            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const q = this.value.trim();
                    box.classList.remove('show');
                    if (q.length > 0) doFullSearch(q);
                }
                if (e.key === 'Escape') {
                    this.value = '';
                    box.classList.remove('show');
                    document.getElementById('resultArea').innerHTML = `
                        <div class="text-center py-5">
                            <span class="mono-icon fs-1"><i class="bi bi-search"></i></span>
                            <p class="mt-3 text-secondary">Digite um modelo para encontrar películas compatíveis</p>
                            <p class="text-secondary small">Ex: Galaxy A15, iPhone 15, Moto G84</p>
                        </div>
                    `;
                    this.blur();
                }
            });

            // Fechar ao clicar fora
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-wrapper')) {
                    box.classList.remove('show');
                }
            });

            // Botão de busca
            document.getElementById('searchBtn').addEventListener('click', function() {
                const q = searchInput.value.trim();
                box.classList.remove('show');
                if (q.length > 0) doFullSearch(q);
            });

            // Sugestões rápidas
            document.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const term = this.dataset.term;
                    searchInput.value = term;
                    box.classList.remove('show');
                    doFullSearch(term);
                });
            });

            // Voz
            document.getElementById('voiceBtn').addEventListener('click', function() {
                this.classList.toggle('active');
                showToast('🎤 Busca por voz ativada...', 'info');
                setTimeout(() => {
                    this.classList.remove('active');
                    searchInput.value = 'Galaxy A15';
                    box.classList.remove('show');
                    doFullSearch('Galaxy A15');
                    showToast('✅ Reconhecido: Galaxy A15', 'success');
                }, 1500);
            });

            // Câmera
            document.getElementById('cameraBtn').addEventListener('click', function() {
                this.classList.toggle('active');
                showToast('📷 INFOCELLL Vision - Analisando imagem...', 'info');
                setTimeout(() => {
                    this.classList.remove('active');
                    searchInput.value = 'iPhone 15 Pro Max';
                    box.classList.remove('show');
                    doFullSearch('iPhone 15 Pro Max');
                    showToast('📱 Modelo identificado: iPhone 15 Pro Max', 'success');
                }, 2000);
            });

            // Atalho Ctrl+K
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                    showToast('⌨️ Campo de busca focado', 'info');
                }
            });

            // =============================================
            // TOAST
            // =============================================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                const borderColor = type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'primary';
                toast.className = `glass-panel p-3 mb-2 toast-item border-start border-4 border-${borderColor}`;
                const icon = type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' :
                    'info-circle';
                toast.innerHTML = `<i class="bi bi-${icon} me-2 mono-icon"></i> ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.3s';
                    setTimeout(() => toast.remove(), 400);
                }, 2800);
            }

            // =============================================
            // THEME
            // =============================================
            const toggleBtn = document.getElementById('themeToggle');
            const body = document.body;
            if (localStorage.getItem('infocelll-theme') === 'dark') {
                body.classList.add('dark-mode');
                toggleBtn.innerHTML = '<i class="bi bi-sun"></i>';
            }
            toggleBtn.addEventListener('click', function() {
                body.classList.toggle('dark-mode');
                const isDark = body.classList.contains('dark-mode');
                toggleBtn.innerHTML = isDark ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon"></i>';
                localStorage.setItem('infocelll-theme', isDark ? 'dark' : 'light');
            });

            // =============================================
            // INICIALIZAÇÃO
            // =============================================
            document.getElementById('totalModels').textContent = database.length;
            document.getElementById('footerModels').textContent = `${database.length} modelos`;

            console.log(`✅ INFOCELLL Busca · ${database.length} modelos carregados`);
            console.log('📌 Busca flutuante - sugestões não ocupam espaço');
        })();
    </script>
</body>
</html>
